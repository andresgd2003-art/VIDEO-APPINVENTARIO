<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escena 1: El Pasado - Sting AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           CONFIGURACIÓN BASE - VERTICAL 9:16
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .video-container {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 9 / 16;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.2);
            border: 1px solid #1a1a1a;
            background-color: #0a0a0a;
        }

        /* ==========================================
           ESCENA 1: EL PASADO - FONDO CAÓTICO
           ========================================== */
        .scene-background {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 100%);
            z-index: 0;
        }

        /* Efecto de papel arrugado estático */
        .paper-texture {
            position: absolute;
            inset: 0;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px),
                repeating-linear-gradient(-45deg, transparent, transparent 2px, rgba(255,255,255,0.008) 2px, rgba(255,255,255,0.008) 4px);
            opacity: 0.6;
            z-index: 1;
        }

        /* Grid técnico rojo que representa el caos */
        .chaos-grid {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(239, 68, 68, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(239, 68, 68, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(400px) rotateX(60deg) translateY(0) translateZ(-80px);
            z-index: 2;
            pointer-events: none;
            animation: chaosShift 25s linear infinite;
        }

        @keyframes chaosShift {
            0% { 
                transform: perspective(400px) rotateX(60deg) translateY(0) translateZ(-80px) rotate(0deg);
            }
            100% { 
                transform: perspective(400px) rotateX(60deg) translateY(30px) translateZ(-80px) rotate(2deg);
            }
        }

        /* Viñeta oscura para enfocar contenido */
        .dark-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0.8) 100%);
            z-index: 3;
            pointer-events: none;
        }

        /* ==========================================
           MARCA DE AGUA - STING AI
           ========================================== */
        .brand-watermark {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 40;
            opacity: 0;
            animation: fadeInBrand 1s ease-out forwards 0.5s;
        }

        @keyframes fadeInBrand {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 0.7; transform: translateX(-50%) translateY(0); }
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .brand-text {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
        }

        /* ==========================================
           ELEMENTO CENTRAL - LIBRETA DESORDENADA
           ========================================== */
        .notebook-container {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 350px;
            perspective: 1200px;
            z-index: 20;
        }

        .notebook-page {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fcd34d 100%);
            border-radius: 8px;
            padding: 25px 20px;
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            transform: rotateX(5deg) rotateY(-2deg);
            opacity: 0;
            animation: notebookAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 1s;
        }

        @keyframes notebookAppear {
            from { 
                opacity: 0; 
                transform: rotateX(25deg) rotateY(-10deg) scale(0.85);
            }
            to { 
                opacity: 1; 
                transform: rotateX(5deg) rotateY(-2deg) scale(1);
            }
        }

        /* Líneas de cuaderno */
        .notebook-lines {
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 28px,
                rgba(139, 92, 246, 0.15) 28px,
                rgba(139, 92, 246, 0.15) 29px
            );
            border-radius: 8px;
            pointer-events: none;
        }

        /* Escritura a mano caótica */
        .handwritten-list {
            position: relative;
            z-index: 10;
            color: #1f2937;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.8;
            font-weight: 600;
        }

        .item-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateX(-20px);
        }

        .item-line:nth-child(1) { animation: writeIn 0.4s ease-out forwards 1.4s; }
        .item-line:nth-child(2) { animation: writeIn 0.4s ease-out forwards 1.6s; }
        .item-line:nth-child(3) { animation: writeIn 0.4s ease-out forwards 1.8s; }
        .item-line:nth-child(4) { animation: writeIn 0.4s ease-out forwards 2.0s; }
        .item-line:nth-child(5) { animation: writeIn 0.4s ease-out forwards 2.2s; }

        @keyframes writeIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Tachadura y correcciones */
        .crossed-out {
            text-decoration: line-through;
            text-decoration-color: #ef4444;
            text-decoration-thickness: 2px;
            opacity: 0.6;
        }

        .messy-price {
            position: relative;
            color: #dc2626;
            font-weight: 900;
        }

        .price-question {
            color: #b91c1c;
            font-size: 1.1rem;
            animation: confused 1.5s ease-in-out infinite;
        }

        @keyframes confused {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* Dedo buscando (simulado con emoji/ícono) */
        .searching-finger {
            position: absolute;
            bottom: 30%;
            right: 15%;
            font-size: 2.5rem;
            filter: grayscale(0.3);
            opacity: 0;
            animation: fingerSearch 3s ease-in-out infinite 2.5s;
            z-index: 25;
            pointer-events: none;
        }

        @keyframes fingerSearch {
            0% { 
                opacity: 0; 
                transform: translate(0, 0) rotate(0deg); 
            }
            10% { 
                opacity: 1;
            }
            25% { 
                transform: translate(-30px, -20px) rotate(-5deg);
            }
            50% { 
                transform: translate(-10px, 10px) rotate(5deg);
            }
            75% { 
                transform: translate(-40px, -10px) rotate(-3deg);
            }
            90% {
                opacity: 1;
            }
            100% { 
                opacity: 0;
                transform: translate(0, 0) rotate(0deg);
            }
        }

        /* Manchas y garabatos */
        .ink-stain {
            position: absolute;
            bottom: 15px;
            left: 20px;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(3px);
        }

        /* ==========================================
           TEXTO DE IMPACTO - PARTE INFERIOR
           ========================================== */
        .impact-section {
            position: absolute;
            bottom: 18%;
            width: 100%;
            text-align: center;
            z-index: 30;
        }

        .question-title {
            font-weight: 900;
            font-size: 2.3rem;
            line-height: 1.05;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
            opacity: 0;
            animation: titleReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 2.8s;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        @keyframes titleReveal {
            from { 
                opacity: 0; 
                transform: scale(1.3) translateY(20px);
                filter: blur(8px);
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .highlight-red {
            color: #ef4444;
            text-shadow: 
                0 0 20px rgba(239, 68, 68, 0.8),
                0 0 40px rgba(239, 68, 68, 0.4);
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { 
                text-shadow: 
                    0 0 20px rgba(239, 68, 68, 0.8),
                    0 0 40px rgba(239, 68, 68, 0.4);
            }
            50% { 
                text-shadow: 
                    0 0 30px rgba(239, 68, 68, 1),
                    0 0 60px rgba(239, 68, 68, 0.6);
            }
        }

        .subtitle-text {
            font-size: 0.95rem;
            color: #9ca3af;
            font-weight: 500;
            line-height: 1.5;
            opacity: 0;
            animation: subtitleFade 1s ease-out forwards 3.3s;
        }

        @keyframes subtitleFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .emphasis-white {
            color: #ffffff;
            font-weight: 700;
        }

        /* ==========================================
           INDICADOR DE INTERACCIÓN
           ========================================== */
        .tap-indicator {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            z-index: 35;
            opacity: 0;
            animation: bouncePrompt 1.5s ease-in-out infinite 4s;
        }

        .tap-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @keyframes bouncePrompt {
            0%, 100% { 
                opacity: 0.5; 
                transform: translateY(0); 
            }
            50% { 
                opacity: 1; 
                transform: translateY(-5px); 
            }
        }

        /* ==========================================
           EFECTOS DE SONIDO VISUALES (SFX)
           ========================================== */
        .sfx-indicator {
            position: absolute;
            top: 50%;
            left: 8%;
            transform: translateY(-50%);
            z-index: 15;
            opacity: 0;
            animation: sfxPop 0.6s ease-out forwards 3.5s;
        }

        .sfx-text {
            font-size: 0.65rem;
            font-weight: 700;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        @keyframes sfxPop {
            0% { 
                opacity: 0; 
                transform: translateY(-50%) scale(0.5); 
            }
            50% { 
                opacity: 1; 
                transform: translateY(-50%) scale(1.1); 
            }
            100% { 
                opacity: 0.8; 
                transform: translateY(-50%) scale(1); 
            }
        }

        /* Segundo indicador de frustración */
        .sfx-frustrated {
            position: absolute;
            top: 50%;
            right: 8%;
            transform: translateY(-50%);
            z-index: 15;
            opacity: 0;
            animation: sfxPop 0.6s ease-out forwards 4s;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Fondo y Texturas -->
        <div class="scene-background"></div>
        <div class="paper-texture"></div>
        <div class="chaos-grid"></div>
        <div class="dark-vignette"></div>

        <!-- Marca de Agua Sting AI -->
        <div class="brand-watermark">
            <div class="brand-dot"></div>
            <span class="brand-text">Sting AI</span>
        </div>

        <!-- Libreta Desordenada Central -->
        <div class="notebook-container">
            <div class="notebook-page">
                <div class="notebook-lines"></div>
                <div class="handwritten-list">
                    <div class="item-line">
                        <span>Martillo 12"</span>
                        <span class="crossed-out">$250</span>
                    </div>
                    <div class="item-line">
                        <span>Llave inglesa</span>
                        <span class="messy-price">$180</span>
                    </div>
                    <div class="item-line crossed-out">
                        <span>Desarmador</span>
                        <span>$???</span>
                    </div>
                    <div class="item-line">
                        <span>Cinta métrica</span>
                        <span class="price-question">$???</span>
                    </div>
                    <div class="item-line">
                        <span>Taladro</span>
                        <span style="color: #6b7280;">¿cuánto?</span>
                    </div>
                </div>
                <div class="ink-stain"></div>
            </div>
            
            <!-- Dedo buscando -->
            <div class="searching-finger">👉</div>
        </div>

        <!-- Indicadores de Efectos de Sonido -->
        <div class="sfx-indicator">
            <div class="sfx-text">*Scratch*</div>
        </div>
        <div class="sfx-frustrated sfx-indicator">
            <div class="sfx-text">*Suspiro*</div>
        </div>

        <!-- Texto de Impacto -->
        <div class="impact-section">
            <h1 class="question-title">
                ¿AÚN EN <br>
                <span class="highlight-red">PAPEL?</span>
            </h1>
            <p class="subtitle-text">
                Buscando precios entre <br>
                <span class="emphasis-white">tachaduras</span> y papel...
            </p>
        </div>

        <!-- Indicador de Interacción -->
        <div class="tap-indicator">
            <div class="tap-text">
                <span>Toca para ver la solución</span>
                <span>👇</span>
            </div>
        </div>
    </div>

    <script>
        // Script simple para restart animation on click (opcional)
        document.querySelector('.video-container').addEventListener('click', function() {
            // Aquí podrías navegar a la escena 2 o reiniciar animaciones
            console.log('Usuario listo para ver la solución');
        });

        // Agregar cursor pointer para indicar interactividad
        document.querySelector('.video-container').style.cursor = 'pointer';
    </script>
</body>
</html>
